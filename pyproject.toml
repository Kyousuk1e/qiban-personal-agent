[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qiban-personal-agent"
version = "0.6.0"
description = "Local Python personal agent with memory, durable tasks and a JavaScript-free UI"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2", "jinja2>=3.1,<4", "python-multipart>=0.0.20,<1", "pypdf>=6,<7", "python-docx>=1.2,<2", "openpyxl>=3.1,<4", "python-pptx>=1,<2", "defusedxml>=0.7,<1"]

[tool.setuptools]
packages = ["qiban"]

[tool.setuptools.package-data]
qiban = ["templates/*.html", "static/*.css"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
